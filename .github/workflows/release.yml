name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      HARBOR_USER: robot$kigawa-net
      DOCKER_REPOSITORY: harbor.kigawa.net/private/velink
      IMAGE_NAME: velink-remote
      MANIFEST_REPO: kigawa-net/kigawa-net-k8s
      MANIFEST_FILE: kigawa-net-k8s/velink/velink.yaml
      YAML_PATH: 'select(documentIndex == 5).spec.template.spec.containers[0].image'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: ${{ env.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{date 'Y'}}{{date 'm'}}{{date 'd'}}-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/velink-remote/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout k8s manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          path: k8s-manifests

      - name: Update image tag in manifest
        run: |
          cd k8s-manifests
          IMG="${{ env.DOCKER_REPOSITORY }}:sha-${{ github.sha }}"
          yq -i '${{ env.YAML_PATH }} = env(IMG)' ${{ env.MANIFEST_FILE }}
          echo "Updated image to: $IMG"

      - name: Commit and push
        run: |
          cd k8s-manifests
          git config user.name github-actions
          git config user.email github-actions@kigawa.net
          git add .
          git commit -m "update velink-remote image to sha-${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push
