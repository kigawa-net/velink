name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    env:
      HARBOR_USER: kigawa
      DOCKER_REPOSITORY: harbor.kigawa.net/private/velink
      IMAGE_NAME: velink-remote
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: ${{ env.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=main-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/velink-remote/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image info
        run: |
          echo "=== Image pushed ==="
          echo "Repository: ${{ env.DOCKER_REPOSITORY }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref_name }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo ""
          echo "=== Next steps ==="
          echo "1. Update k8s manifest image field to one of the pushed tags:"
          echo "   - version tag push (vX.Y.Z): ${{ env.DOCKER_REPOSITORY }}:X.Y.Z"
          echo "   - main push: ${{ env.DOCKER_REPOSITORY }}:main-<short SHA (7 chars)>"
          echo "2. Apply via kubectl or ArgoCD"

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build desktop
        run: cargo build -p velink-desktop --release --locked

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build NSIS installer
        run: cargo packager -p velink-desktop --release --formats nsis

      - name: Locate installer
        id: installer
        shell: bash
        run: |
          find . -name '*-setup.exe' -not -path './target/release/build/*'
          echo "path=$(find . -name '*-setup.exe' -not -path './target/release/build/*' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: velink-windows-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.installer.outputs.path }}
