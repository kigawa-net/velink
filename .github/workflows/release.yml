name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    env:
      HARBOR_USER: kigawa
      DOCKER_REPOSITORY: harbor.kigawa.net/private/velink
      IMAGE_NAME: velink-remote
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: ${{ env.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASS }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_REPOSITORY }}
          tags: |
            type=raw,value=latest
            type=raw,value=main-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: crates/velink-remote/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image info
        run: |
          echo "=== Image pushed ==="
          echo "Repository: ${{ env.DOCKER_REPOSITORY }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo ""
          echo "=== Next steps ==="
          echo "1. Update k8s manifest image field to:"
          echo "   ${{ env.DOCKER_REPOSITORY }}:sha-${{ github.sha }}"
          echo "2. Apply via kubectl or ArgoCD"
