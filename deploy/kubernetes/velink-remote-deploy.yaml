apiVersion: apps/v1
kind: Deployment
metadata:
  name: velink-remote
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: velink-remote
  template:
    metadata:
      labels:
        app: velink-remote
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: desktop
          image: velink-remote:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: websocket
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: VELINK_WIDTH
              value: "1280"
            - name: VELINK_HEIGHT
              value: "720"
          startupProbe:
            httpGet:
              path: /healthz
              port: websocket
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: websocket
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: websocket
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
